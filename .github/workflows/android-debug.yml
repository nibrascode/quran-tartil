name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Add Android platform (generated, not committed)
        run: npx cap add android
      - name: Permissions (microphone, notifications, wake lock)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' $f
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $f
          grep -q WAKE_LOCK $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' $f
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quran-tartil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
