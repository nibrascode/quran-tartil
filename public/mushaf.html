<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3330" />
    <title>Yazı formaları</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #f6f1e4;
        color: #1a1612;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        background: #1a3330;
        color: #e4c98a;
        padding: calc(0.45rem + env(safe-area-inset-top)) 0.6rem 0.45rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      header a { color: #e4c98a; text-decoration: none; font-size: 1.35rem; line-height: 1; }
      header h1 { margin: 0; font-size: 0.98rem; font-weight: 600; }
      header p { margin: 0.1rem 0 0; font-size: 0.72rem; opacity: 0.8; }
      .page {
        flex: 1;
        min-height: 0;
        margin: 0.35rem 0.3rem 0.2rem;
        background: #fffaf0;
        border: 1px solid #e4d3a8;
        border-radius: 0.7rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        margin-bottom: calc(0.45rem + env(safe-area-inset-bottom));
      }
      .line {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        white-space: nowrap;
      }
      .line.surah { font-family: surahnames, serif; color: #1a3330; }
      .sname { font-family: surahnames, serif; line-height: 1; display: block; }
    </style>
  </head>
  <body>
    <header>
      <a href="./index.html" aria-label="Geri">‹</a>
      <div>
        <h1>Mədinə səhifəsi</h1>
        <p id="pos">1 / 604</p>
      </div>
    </header>
    <main class="page" id="page"></main>
    <script>
      const LAST = 604;
      const STARTS = "1:1:2,2:2:3,3:50:3,4:77:2,5:106:8,6:128:3,7:151:3,8:177:3,9:187:2,10:208:2,11:221:9,12:235:11,13:249:3,14:255:5,15:262:3,16:267:9,17:282:3,18:293:12,19:305:3,20:312:7,21:322:3,22:332:2,23:342:2,24:350:2,25:359:13,26:367:2,27:377:2,28:385:10,29:396:10,30:404:12,31:411:3,32:415:2,33:418:2,34:428:3,35:434:10,36:440:6,37:446:2,38:453:2,39:458:6,40:467:5,41:477:3,42:483:3,43:489:7,44:496:3,45:499:2,46:502:9,47:507:2,48:511:3,49:515:9,50:518:3,51:520:14,52:523:10,53:526:2,54:528:12,55:531:7,56:534:9,57:537:13,58:542:3,59:545:9,60:549:2,61:551:9,62:553:3,63:554:9,64:556:2,65:558:2,66:560:3,67:562:3,68:564:8,69:566:12,70:568:11,71:570:7,72:572:3,73:574:3,74:575:10,75:577:8,76:578:12,77:580:9,78:582:3,79:583:10,80:585:2,81:586:4,82:587:3,83:587:14,84:589:5,85:590:4,86:591:3,87:591:12,88:592:7,89:593:5,90:594:8,91:595:4,92:595:13,93:596:8,94:596:15,95:597:5,96:597:11,97:598:6,98:598:11,99:599:8,100:599:14,101:600:6,102:600:13,103:601:3,104:601:7,105:601:13,106:602:3,107:602:8,108:602:14,109:603:3,110:603:8,111:603:13,112:604:3,113:604:7,114:604:12";
      const heads = {};
      for (const item of STARTS.split(",")) {
        const [id, page, line] = item.split(":").map(Number);
        (heads[page] ||= {})[line - 2] = id;
      }
      let namesReady = null;
      function loadNames() {
        if (!namesReady) {
          const face = new FontFace("surahnames", "url(./yazi-fonts/sura_names.woff2)");
          namesReady = face.load().then(() => document.fonts.add(face));
        }
        return namesReady;
      }
      let pageNo = 1;
      let pages = null;
      const loaded = new Set();
      const board = document.getElementById("page");
      const pos = document.getElementById("pos");

      function fit() {
        const w = board.clientWidth - 16;
        const h = board.clientHeight;
        let size = h / 15;
        for (let i = 0; i < 3; i++) {
          board.style.fontSize = size + "px";
          let widest = 0;
          for (const line of board.querySelectorAll(".line:not(.surah)")) widest = Math.max(widest, line.scrollWidth);
          if (widest <= w || widest === 0) break;
          size *= (w / widest) * 0.94;
        }
        board.style.fontSize = size * 0.9 + "px";
        const nameSize = board.clientHeight / 15 / 0.78;
        for (const name of board.querySelectorAll(".sname")) {
          name.style.fontSize = nameSize + "px";
          if (name.scrollWidth > w) name.style.fontSize = nameSize * (w / name.scrollWidth) + "px";
        }
      }

      let job = 0;
      async function show(n) {
        const id = ++job;
        pageNo = Math.max(1, Math.min(LAST, n));
        const name = "QCF" + pageNo;
        if (!loaded.has(pageNo)) {
          try {
            const face = new FontFace(name, "url(./yazi-fonts/qcf/p" + pageNo + ".woff2)");
            await face.load();
            if (id !== job) return;
            document.fonts.add(face);
            loaded.add(pageNo);
          } catch (err) {
            if (id !== job) return;
          }
        }
        if (id !== job) return;
        board.style.fontFamily = name + ", serif";
        const marks = heads[pageNo] || {};
        board.replaceChildren();
        pages[String(pageNo)].forEach((text, i) => {
          const row = document.createElement("div");
          row.className = marks[i] ? "line surah" : "line";
          if (marks[i]) {
            const name = document.createElement("span");
            name.className = "sname";
            name.textContent = String.fromCharCode(0xe000 + marks[i]);
            row.appendChild(name);
          } else row.textContent = text;
          board.appendChild(row);
        });
        pos.textContent = pageNo + " / " + LAST;
        fit();
        const ahead = pageNo + 1;
        if (ahead <= LAST && !loaded.has(ahead)) {
          const nextFace = new FontFace("QCF" + ahead, "url(./yazi-fonts/qcf/p" + ahead + ".woff2)");
          nextFace.load().then(() => { document.fonts.add(nextFace); loaded.add(ahead); }).catch(() => {});
        }
      }

      let startX = null;
      board.addEventListener("pointerdown", (e) => {
        startX = e.clientX;
        try { board.setPointerCapture(e.pointerId); } catch (err) {}
      });
      board.addEventListener("pointerup", (e) => {
        if (startX == null) return;
        const dx = e.clientX - startX;
        startX = null;
        if (dx > 36) show(pageNo + 1);
        else if (dx < -36) show(pageNo - 1);
      });
      board.addEventListener("pointercancel", () => { startX = null; });
      window.addEventListener("resize", fit);
      fetch("./yazi-pages.json").then((r) => r.json()).then((json) => { pages = json; loadNames().then(() => show(1)); });
    </script>
  </body>
</html>
