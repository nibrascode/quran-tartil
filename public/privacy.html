<script>const D={"en":{"name":"English","title":"Privacy Policy","updatedLabel":"Last updated","secs":[["In short","Quran Tartil works offline. There are no accounts, no ads and no analytics. We do not collect, sell or share personal data."],["What stays on your device","Bookmarks, your last page, reading progress, daily counts, goals, settings and the reminder time are stored only on your device (browser storage or app storage). They are never uploaded. You can delete everything in Settings > Reset & clear data."],["Microphone and speech recognition","The microphone is used only while you press Start in the optional Tartil check. The app does not record or store audio. Speech-to-text is done by your device's speech recognition service. On Android and in Chrome this is usually Google's speech service, which may process your voice on Google servers under Google's own privacy policy. The app only receives the recognised text and compares it with the ayah on your device."],["Notifications","Daily reminders are local notifications scheduled on your device. There is no push server and no account."],["Copy, share and links","Ayah text is copied or shared only when you tap Copy or Share, and goes to the app you choose. Links (for example tanzil.net) open in your browser only when you tap them."],["Web version hosting","The web version is served by GitHub Pages. As with any website, the host may keep standard server logs (such as IP address). The app itself sends no analytics or tracking requests. The installed Android app makes no network requests of its own except what the speech service does."],["Quran text and fonts","The Arabic Quran text comes from the Tanzil Project (tanzil.net, CC BY 3.0) and is bundled unchanged inside the app. The font is Amiri Quran (SIL OFL). Nothing is downloaded at runtime."],["Children and data sale","The app has no accounts and collects nothing, so there is nothing to sell or share. It is suitable for all ages."],["Translations and tafsirs","Translations and tafsirs are downloaded only when you tap Download (in Settings or in the ayah panel), then stored on your device and can be deleted there. They come from this app's own site (GitHub Pages; translation texts from Tanzil.net, tafsir texts from Quran.com). Nothing about you or your reading is sent."],["Contact and changes","Questions: nibrascode@gmail.com. If this policy changes, the new version and date will appear in the app and at the privacy page."]]},"az":{"name":"Azərbaycanca","title":"Məxfilik Siyasəti","updatedLabel":"Son yenilənmə","secs":[["Qısaca","Quran Tartil oflayn işləyir. Hesab, reklam və analitika yoxdur. Şəxsi məlumat toplamırıq, satmırıq və paylaşmırıq."],["Cihazınızda nə qalır","Əlfəcinlər, son səhifə, oxu irəliləyişi, gündəlik say, hədəflər, ayarlar və xatırlatma vaxtı yalnız cihazınızda (brauzer və ya tətbiq yaddaşı) saxlanır. Heç vaxt yüklənmir. Hamısını Ayarlar > Sıfırla və məlumatları sil bölməsində silə bilərsiniz."],["Mikrofon və səs tanıma","Mikrofon yalnız könüllü Tərtil yoxlamasında Başla düyməsini basanda istifadə olunur. Tətbiq səsi yazmır və saxlamır. Səsin mətnə çevrilməsini cihazınızın səs tanıma xidməti edir. Android və Chrome-da bu adətən Google-un səs xidmətidir və səsinizi Google serverlərində, Google-un öz məxfilik siyasətinə uyğun emal edə bilər. Tətbiq yalnız tanınmış mətni alır və onu ayə ilə cihazınızda müqayisə edir."],["Bildirişlər","Gündəlik xatırlatmalar cihazda planlanan lokal bildirişlərdir. Push serveri və hesab yoxdur."],["Kopyalama, paylaşma və keçidlər","Ayə mətni yalnız Kopyala və ya Paylaş düyməsini basanda kopyalanır və ya seçdiyiniz tətbiqə göndərilir. Keçidlər (məsələn tanzil.net) yalnız toxunanda brauzerdə açılır."],["Veb versiyanın yerləşdirilməsi","Veb versiya GitHub Pages ilə təqdim olunur. Hər saytda olduğu kimi, host standart server jurnalları (məsələn IP ünvanı) saxlaya bilər. Tətbiqin özü analitika və ya izləmə sorğusu göndərmir. Quraşdırılmış Android tətbiqi, səs tanıma xidmətinin etdiyindən başqa, özü şəbəkə sorğusu göndərmir."],["Quran mətni və şriftlər","Ərəbcə Quran mətni Tanzil Layihəsindən (tanzil.net, CC BY 3.0) götürülüb və tətbiqin içinə dəyişdirilmədən qoyulub. Şrift Amiri Quran-dır (SIL OFL). İş zamanı heç nə yüklənmir."],["Uşaqlar və məlumat satışı","Tətbiqdə hesab yoxdur və heç nə toplanmır, ona görə satılacaq və ya paylaşılacaq heç nə yoxdur. Bütün yaşlar üçün uyğundur."],["Tərcümə və təfsirlər","Tərcümə və təfsirlər yalnız “Endir” düyməsinə (Ayarlarda və ya ayə panelində) toxunanda endirilir, cihazınızda saxlanır və orada silinə bilər. Hamısı tətbiqin öz saytından gəlir (GitHub Pages; tərcümə mətnləri Tanzil.net-dən, təfsir mətnləri Quran.com-dan). Sizin və ya oxumağınız haqqında heç nə göndərilmir."],["Əlaqə və dəyişikliklər","Suallar: nibrascode@gmail.com. Siyasət dəyişsə, yeni versiya və tarix tətbiqdə və məxfilik səhifəsində görünəcək."]]},"tr":{"name":"Türkçe","title":"Gizlilik Politikası","updatedLabel":"Son güncelleme","secs":[["Kısaca","Quran Tartil çevrimdışı çalışır. Hesap, reklam ve analitik yoktur. Kişisel veri toplamayız, satmayız ve paylaşmayız."],["Cihazınızda neler kalır","Yer imleri, son sayfa, okuma ilerlemesi, günlük sayılar, hedefler, ayarlar ve hatırlatma saati yalnızca cihazınızda (tarayıcı veya uygulama depolaması) saklanır. Asla yüklenmez. Hepsini Ayarlar > Sıfırla ve verileri sil bölümünden silebilirsiniz."],["Mikrofon ve konuşma tanıma","Mikrofon yalnızca isteğe bağlı Tertil kontrolünde Başlat'a bastığınızda kullanılır. Uygulama sesi kaydetmez ve saklamaz. Konuşmanın metne çevrilmesini cihazınızın konuşma tanıma hizmeti yapar. Android'de ve Chrome'da bu genellikle Google'ın konuşma hizmetidir ve sesinizi Google'ın kendi gizlilik politikasına göre Google sunucularında işleyebilir. Uygulama yalnızca tanınan metni alır ve ayetle cihazınızda karşılaştırır."],["Bildirimler","Günlük hatırlatmalar cihazda planlanan yerel bildirimlerdir. Push sunucusu ve hesap yoktur."],["Kopyalama, paylaşma ve bağlantılar","Ayet metni yalnızca Kopyala veya Paylaş'a dokunduğunuzda kopyalanır veya seçtiğiniz uygulamaya gönderilir. Bağlantılar (örneğin tanzil.net) yalnızca dokunduğunuzda tarayıcıda açılır."],["Web sürümü barındırma","Web sürümü GitHub Pages ile sunulur. Her web sitesinde olduğu gibi barındırıcı standart sunucu günlükleri (IP adresi gibi) tutabilir. Uygulamanın kendisi analitik veya izleme isteği göndermez. Kurulu Android uygulaması, konuşma hizmetinin yaptığı dışında kendi ağ isteği yapmaz."],["Kur'an metni ve yazı tipleri","Arapça Kur'an metni Tanzil Projesi'nden (tanzil.net, CC BY 3.0) alınmış ve uygulamanın içine değiştirilmeden konmuştur. Yazı tipi Amiri Quran'dır (SIL OFL). Çalışma sırasında hiçbir şey indirilmez."],["Çocuklar ve veri satışı","Uygulamada hesap yoktur ve hiçbir şey toplanmaz, bu yüzden satılacak veya paylaşılacak bir şey yoktur. Her yaşa uygundur."],["Translations and tafsirs","Translations and tafsirs are downloaded only when you tap Download (in Settings or in the ayah panel), then stored on your device and can be deleted there. They come from this app's own site (GitHub Pages; translation texts from Tanzil.net, tafsir texts from Quran.com). Nothing about you or your reading is sent."],["İletişim ve değişiklikler","Sorular: nibrascode@gmail.com. Politika değişirse yeni sürüm ve tarih uygulamada ve gizlilik sayfasında görünür."]]},"ar":{"name":"العربية","title":"سياسة الخصوصية","updatedLabel":"آخر تحديث","secs":[["باختصار","يعمل «ترتيل القرآن» دون اتصال. لا حسابات ولا إعلانات ولا تحليلات. لا نجمع بياناتك الشخصية ولا نبيعها ولا نشاركها."],["ما يبقى على جهازك","تُحفظ العلامات وآخر صفحة وتقدم القراءة والأعداد اليومية والأهداف والإعدادات ووقت التذكير على جهازك فقط (تخزين المتصفح أو التطبيق). لا تُرفع أبداً. يمكنك حذف كل شيء من الإعدادات > إعادة الضبط ومسح البيانات."],["الميكروفون والتعرف على الكلام","يُستخدم الميكروفون فقط عند ضغط «ابدأ» في فحص الترتيل الاختياري. لا يسجّل التطبيق الصوت ولا يخزّنه. يتم تحويل الكلام إلى نص بواسطة خدمة التعرف على الكلام في جهازك. وفي أندرويد وChrome غالباً ما تكون خدمة Google للكلام، وقد تعالج صوتك على خوادم Google وفق سياسة الخصوصية الخاصة بها. يستقبل التطبيق النص المُتعرَّف عليه فقط ويقارنه بالآية على جهازك."],["الإشعارات","التذكيرات اليومية إشعارات محلية مجدولة على جهازك. لا خادم إشعارات ولا حساب."],["النسخ والمشاركة والروابط","يُنسخ نص الآية أو يُشارَك فقط عند ضغط «نسخ» أو «مشاركة»، ويذهب إلى التطبيق الذي تختاره. تُفتح الروابط (مثل tanzil.net) في المتصفح فقط عند المسّ عليها."],["استضافة النسخة الويب","تُقدَّم نسخة الويب عبر GitHub Pages. كما في أي موقع، قد يحتفظ المضيف بسجلات خادم معتادة (مثل عنوان IP). لا يرسل التطبيق نفسه أي طلبات تحليلات أو تتبع. تطبيق أندرويد المثبّت لا يجري طلبات شبكة بنفسه عدا ما تفعله خدمة الكلام."],["نص القرآن والخطوط","نص القرآن العربي من مشروع تنزيل (tanzil.net، CC BY 3.0) ومضمَّن في التطبيق دون تغيير. الخط هو Amiri Quran (SIL OFL). لا يُنزَّل شيء أثناء التشغيل."],["الأطفال وبيع البيانات","لا حسابات في التطبيق ولا يجمع شيئاً، فلا شيء يُباع أو يُشارَك. مناسب لجميع الأعمار."],["الترجمات والتفاسير","تُنزَّل الترجمات والتفاسير فقط عند الضغط على «تنزيل» (في الإعدادات أو في لوحة الآية)، وتُحفظ على جهازك ويمكن حذفها من هناك. وكلها من موقع التطبيق نفسه (GitHub Pages؛ نصوص الترجمات من Tanzil.net ونصوص التفاسير من Quran.com). لا يُرسل أي شيء عنك أو عن قراءتك."],["التواصل والتغييرات","للاستفسار: nibrascode@gmail.com. إذا تغيّرت السياسة ستظهر النسخة الجديدة وتاريخها في التطبيق وفي صفحة الخصوصية."]]},"ru":{"name":"Русский","title":"Политика конфиденциальности","updatedLabel":"Обновлено","secs":[["Коротко","Quran Tartil работает офлайн. Нет аккаунтов, рекламы и аналитики. Мы не собираем, не продаём и не передаём личные данные."],["Что остаётся на вашем устройстве","Закладки, последняя страница, прогресс чтения, дневные счётчики, цели, настройки и время напоминания хранятся только на вашем устройстве (хранилище браузера или приложения). Они никогда не выгружаются. Удалить всё можно в Настройки > Сброс и удаление данных."],["Микрофон и распознавание речи","Микрофон используется только когда вы нажимаете «Старт» в необязательной проверке тартиля. Приложение не записывает и не хранит звук. Преобразование речи в текст выполняет служба распознавания речи вашего устройства. На Android и в Chrome это обычно речевая служба Google, которая может обрабатывать ваш голос на серверах Google по собственной политике конфиденциальности Google. Приложение получает только распознанный текст и сравнивает его с аятом на вашем устройстве."],["Уведомления","Ежедневные напоминания — это локальные уведомления, запланированные на вашем устройстве. Нет push-сервера и аккаунта."],["Копирование, отправка и ссылки","Текст аята копируется или отправляется только когда вы нажимаете «Копировать» или «Поделиться» и попадает в выбранное вами приложение. Ссылки (например, tanzil.net) открываются в браузере только по вашему нажатию."],["Хостинг веб-версии","Веб-версия размещена на GitHub Pages. Как и любой сайт, хостинг может вести стандартные серверные журналы (например, IP-адрес). Само приложение не отправляет аналитику или трекинг. Установленное Android-приложение не делает собственных сетевых запросов, кроме работы службы распознавания речи."],["Текст Корана и шрифты","Арабский текст Корана взят из проекта Tanzil (tanzil.net, CC BY 3.0) и встроен в приложение без изменений. Шрифт — Amiri Quran (SIL OFL). Во время работы ничего не загружается."],["Дети и продажа данных","В приложении нет аккаунтов, оно ничего не собирает, поэтому нечего продавать или передавать. Подходит для любого возраста."],["Translations and tafsirs","Translations and tafsirs are downloaded only when you tap Download (in Settings or in the ayah panel), then stored on your device and can be deleted there. They come from this app's own site (GitHub Pages; translation texts from Tanzil.net, tafsir texts from Quran.com). Nothing about you or your reading is sent."],["Контакты и изменения","Вопросы: nibrascode@gmail.com. Если политика изменится, новая версия и дата появятся в приложении и на странице конфиденциальности."]]}},U="2026-10-26";
const nav=document.getElementById("nav"),m=document.getElementById("m");
function show(id){const l=D[id];document.documentElement.lang=id;document.documentElement.dir=id==="ar"?"rtl":"ltr";m.innerHTML="<h1></h1><p><small></small></p>";m.querySelector("h1").textContent=l.title;m.querySelector("small").textContent=l.updatedLabel+": "+U;for(const [h,b] of l.secs){const a=document.createElement("h2");a.textContent=h;const p=document.createElement("p");p.textContent=b;m.append(a,p)}[...nav.children].forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.id===id)));history.replaceState(null,"","#"+id)}
for(const id of Object.keys(D)){const b=document.createElement("button");b.textContent=D[id].name;b.dataset.id=id;b.onclick=()=>show(id);nav.append(b)}
const h=location.hash.slice(1);show(D[h]?h:(D[(navigator.language||"en").slice(0,2)]?(navigator.language||"en").slice(0,2):"en"));</script></body></html>
