<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3330" />
    <title>Yazı formaları</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #f6f1e4;
        color: #1a1612;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        background: #1a3330;
        color: #e4c98a;
        padding: calc(0.45rem + env(safe-area-inset-top)) 0.6rem 0.45rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      header a { color: #e4c98a; text-decoration: none; font-size: 1.35rem; line-height: 1; }
      header h1 { margin: 0; font-size: 0.98rem; font-weight: 600; }
      header p { margin: 0.1rem 0 0; font-size: 0.72rem; opacity: 0.8; }
      .page {
        flex: 1;
        min-height: 0;
        margin: 0.35rem 0.3rem 0.2rem;
        background: #fffaf0;
        border: 1px solid #e4d3a8;
        border-radius: 0.7rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        touch-action: pan-y;
      }
      .line {
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        white-space: nowrap;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.35rem 0.6rem calc(0.4rem + env(safe-area-inset-bottom));
      }
      footer button {
        border: 1px solid #c4b48a;
        background: #1a3330;
        color: #f6f1e4;
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font: inherit;
        font-size: 0.85rem;
      }
      footer button:disabled { opacity: 0.35; }
      #pos { font-size: 0.85rem; color: #1a3330; }
    </style>
  </head>
  <body>
    <header>
      <a href="./index.html" aria-label="Geri">‹</a>
      <div>
        <h1>Mədinə səhifəsi</h1>
        <p>Bütün Quran, sağdan sola</p>
      </div>
    </header>
    <main class="page" id="page"></main>
    <footer>
      <button type="button" id="next">Növbəti</button>
      <span id="pos"></span>
      <button type="button" id="prev">Əvvəlki</button>
    </footer>
    <script>
      const LAST = 604;
      let pageNo = 1;
      let pages = null;
      const loaded = new Set();
      const board = document.getElementById("page");
      const pos = document.getElementById("pos");

      function fit() {
        const w = board.clientWidth - 16;
        const h = board.clientHeight;
        let size = h / 15;
        for (let i = 0; i < 3; i++) {
          board.style.fontSize = size + "px";
          let widest = 0;
          for (const line of board.querySelectorAll(".line")) widest = Math.max(widest, line.scrollWidth);
          if (widest <= w || widest === 0) break;
          size *= (w / widest) * 0.94;
        }
        board.style.fontSize = size * 0.9 + "px";
      }

      let job = 0;
      async function show(n) {
        const id = ++job;
        pageNo = Math.max(1, Math.min(LAST, n));
        const name = "QCF" + pageNo;
        if (!loaded.has(pageNo)) {
          const face = new FontFace(name, "url(./yazi-fonts/qcf/p" + pageNo + ".woff2)");
          await face.load();
          if (id !== job) return;
          document.fonts.add(face);
          loaded.add(pageNo);
        }
        if (id !== job) return;
        board.style.fontFamily = name + ", serif";
        board.replaceChildren();
        for (const text of pages[String(pageNo)]) {
          const row = document.createElement("div");
          row.className = "line";
          row.textContent = text;
          board.appendChild(row);
        }
        pos.textContent = pageNo + " / " + LAST;
        document.getElementById("prev").disabled = pageNo === 1;
        document.getElementById("next").disabled = pageNo === LAST;
        fit();
      }

      document.getElementById("prev").onclick = () => show(pageNo - 1);
      document.getElementById("next").onclick = () => show(pageNo + 1);
      let startX = 0;
      board.addEventListener("pointerdown", (e) => { startX = e.clientX; });
      board.addEventListener("pointerup", (e) => {
        const dx = e.clientX - startX;
        if (dx > 50) show(pageNo + 1);
        else if (dx < -50) show(pageNo - 1);
      });
      window.addEventListener("resize", fit);
      fetch("./yazi-pages.json").then((r) => r.json()).then((json) => { pages = json; show(1); });
    </script>
  </body>
</html>
